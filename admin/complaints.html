<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Complaints</title><link rel="stylesheet" href="/admin/sidebar.css"><style>body{margin:0;font-family:Arial;background:#f5f7fa;color:#172033}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.content{padding:28px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.filters>*{padding:9px;border:1px solid #cbd5e1;border-radius:5px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;vertical-align:top}select{padding:7px}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside id="adminSidebar" class="sidebar"></aside><main class="content"><h1>Sales: Customer Complaints</h1><div class="filters"><select id="status"><option value="">All statuses</option><option>open</option><option>in_progress</option><option>resolved</option><option>closed</option></select><input id="from" type="date"><input id="to" type="date"><button id="filter">Filter</button></div><table><thead><tr><th>Reference</th><th>Customer</th><th>Contact</th><th>Order</th><th>Description</th><th>Created</th><th>Resolved</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></main></div><script src="/admin/sidebar.js"></script><script>const $=id=>document.getElementById(id);async function load(){const p=new URLSearchParams({status:$('status').value,from_date:$('from').value,to_date:$('to').value});const r=await fetch('/api/admin/complaints?'+p);const d=await r.json();$('rows').innerHTML=d.complaints.map(c=>`<tr><td>${c.complaint_number}</td><td>${c.customer_name||'-'}</td><td>${c.contact_method||'-'}: ${c.contact_value||'-'}</td><td>${c.order_number||'-'}</td><td>${c.description}</td><td>${c.created_at}</td><td>${c.resolved_at||'-'}</td><td><select onchange="updateStatus(${c.id},this.value)">${['open','in_progress','resolved','closed'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}async function updateStatus(id,status){await fetch('/api/admin/complaints/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}$('filter').onclick=load;load()</script></body></html>
